name: Purchase inquiry
description: Ask about the Agent Approval Inbox commercial source package.
title: "Purchase inquiry: "
labels:
  - purchase-inquiry
body:
  - type: markdown
    attributes:
      value: |
        Please do not include passwords, payment details, personal identification, or other sensitive information.
  - type: dropdown
    id: inquiry_type
    attributes:
      label: What would you like to do?
      options:
        - Check compatibility before purchasing
        - Purchase the USD 29 commercial source package
        - Ask about post-purchase integration guidance
        - Ask a licensing question
    validations:
      required: true
  - type: dropdown
    id: use_case
    attributes:
      label: Intended use
      options:
        - Personal automation
        - Client project
        - Internal team workflow
        - Evaluation before purchase
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow summary
      description: Briefly describe the local workflow you want to connect.
    validations:
      required: true
  - type: dropdown
    id: macos
    attributes:
      label: macOS version
      options:
        - macOS 15 or later
        - macOS 14
        - Earlier than macOS 14
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: integration_language
    attributes:
      label: Workflow language
      description: Select the main language used by the workflow that will write the JSON queue.
      options:
        - Python
        - Shell
        - Node.js or TypeScript
        - Swift
        - Another language
        - Not decided yet
    validations:
      required: true
  - type: dropdown
    id: timeline
    attributes:
      label: Preferred timeline
      options:
        - Within 3 days
        - Within 1 week
        - Within 1 month
        - Exploring for later
    validations:
      required: true
